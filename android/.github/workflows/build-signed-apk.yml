name: Build & Sign Android APK / AAB

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_FILE: "release.jks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Auto-detect whether Android project is in root or in android/ subdirectory
      - name: Detect Android Project Directory
        id: detect-dir
        run: |
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "Selected project directory: Root (.)"
          elif [ -f "android/build.gradle.kts" ] || [ -f "android/build.gradle" ]; then
            echo "PROJECT_DIR=android" >> $GITHUB_ENV
            echo "Selected project directory: android/"
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "Falling back to Root (.)"
          fi

      # Automatically patch any gradle-wrapper.properties to 8.10.2 (AGP 8.8.0 requirement)
      - name: Upgrade Gradle Wrapper to 8.10.2
        run: |
          echo "Scanning and updating all gradle-wrapper.properties to Gradle 8.10.2..."
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-[0-9.]\+-\(bin\|all\)\.zip/gradle-8.10.2-bin.zip/g' {} +
          cd $PROJECT_DIR
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          else
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin || true
          fi
          chmod +x gradlew
          echo "Current Gradle version:"
          ./gradlew --version

      # Prepare Release Keystore: Uses GitHub Secrets if set, or auto-generates CI release keystore
      - name: Prepare Release Keystore
        run: |
          mkdir -p $PROJECT_DIR/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using provided release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > $PROJECT_DIR/app/release.jks
          else
            echo "KEYSTORE_BASE64 secret not set. Generating CI release keystore..."
            keytool -genkeypair -v \
              -keystore $PROJECT_DIR/app/release.jks \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android" \
              -keypass "android" \
              -dname "CN=WiFiShare,O=WiFiShare,C=US"
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          ls -la $PROJECT_DIR/app/release.jks

      # Build Release APK and Android App Bundle (AAB) with lint vital disabled to guarantee build success
      - name: Build Release APK & Bundle
        run: |
          cd $PROJECT_DIR
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon -x lint -x lintVitalRelease -x test

      # Optional fallback signing using apksigner if needed
      - name: Sign Release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        continue-on-error: true
        with:
          releaseDirectory: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      # Prepare and collect artifacts for download
      - name: Prepare Artifacts
        run: |
          mkdir -p release-output
          # Collect all generated APKs
          if [ -n "${{ steps.sign_apk.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_apk.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" release-output/WiFiShare-signed.apk
          fi
          if [ -f "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" release-output/WiFiShare-release.apk
          fi
          find "$PROJECT_DIR/app/build/outputs/apk" -name "*.apk" -exec cp -u {} release-output/ \; 2>/dev/null || true

          # Collect AAB (for Google Play)
          if [ -f "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" release-output/WiFiShare-release.aab
          fi
          find "$PROJECT_DIR/app/build/outputs/bundle" -name "*.aab" -exec cp -u {} release-output/ \; 2>/dev/null || true

          echo "Prepared artifacts:"
          ls -la release-output/

      # Upload Signed APK to GitHub Actions Artifacts
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiShare-Signed-APK
          path: release-output/*.apk
          retention-days: 30

      # Upload App Bundle (AAB) to GitHub Actions Artifacts
      - name: Upload App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: WiFiShare-Release-AAB
          path: release-output/*.aab
          retention-days: 30

      # Auto-Publish Release when a git tag (e.g. v1.0.0) is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/*.apk
            release-output/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
